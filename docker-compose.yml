services:
  postgres:
    image: postgres:16
    container_name: ads_agent_postgres
    environment:
      POSTGRES_DB: ads_agent
      POSTGRES_USER: ads_agent
      POSTGRES_PASSWORD: ads_agent
    ports:
      - "5432:5432"
    volumes:
      - ads_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_agent -d ads_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ads_agent_postgres_data:
